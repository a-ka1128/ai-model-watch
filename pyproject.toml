[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-model-watch"
version = "0.1.0"
description = "Local-first AI model intelligence and weekly report platform"
requires-python = ">=3.11"
dependencies = ["trafilatura>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
ai-model-watch = "ai_model_watch.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
