name: AI Model Watch weekly pipeline

on:
  schedule:
    - cron: "17 1 * * 1"
  workflow_dispatch:

jobs:
  collect-analyze-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install .
      - name: Run weekly pipeline
        env:
          AI_MODEL_WATCH_LLM: heuristic
        run: python -m ai_model_watch run-weekly --limit 100
